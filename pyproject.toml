[project]
name = "post-training-lab"
version = "0.2.0"
description = "A small, readable, runnable post-training codebase (SFT + GRPO with LoRA) you can learn from and customize."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Uygar Kurt" }]
keywords = ["post-training", "sft", "grpo", "rlhf", "lora", "mlx"]
dependencies = [
    "datasets>=4.8.4",
    "numpy>=2.0",
    "tensorboard>=2.20.0",
    "tensorboardx>=2.6.5",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.31.1",
    "mlx-lm>=0.31.2",
]
cuda = [
    "peft>=0.19.1",
    "transformers>=5.5.3",
]
eval = [
    "math-verify[antlr4-11-0]>=0.9.0",
]
evaluate = [
    "evalscope[bfcl]==1.11.1",
    "lm-eval[ifeval,math,vllm]==0.4.13",
    "soundfile>=0.13.1",
]

[tool.uv]
override-dependencies = [
    { package = { name = "bfcl-eval", version = "2025.10.27.1" }, dependencies = ["numpy>=2.0"] },
    { package = { name = "evalscope", version = "1.11.1" }, dependencies = ["latex2sympy2-extended[antlr4-11-0]"] },
]

[project.urls]
Homepage = "https://github.com/uygarkurt/post-training-lab"
Repository = "https://github.com/uygarkurt/post-training-lab"
